<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Alma & Origen</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body style="background: #0D0806; min-height: 100vh;">

  <!-- NAVBAR -->
  <header class="navbar" id="mainNavbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo" aria-label="Alma &amp; Origen Inicio">
        <img src="assets/images/logo-original.png" alt="Alma &amp; Origen Logotipo" class="brand-emblem-img">
        <div class="brand-text-wrap">
          <span class="brand-name">Alma &amp; Origen</span>
          <span class="brand-tagline">Cafe de Origen - Norte del Cauca</span>
        </div>
      </a>
      <nav aria-label="Navegacion Principal">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Inicio</a></li>
          <li><a href="origen.html" class="nav-link">Nuestro Origen</a></li>
          <li><a href="portafolio.html" class="nav-link">Productos</a></li>
          <li><a href="contacto.html" class="nav-link">Contacto</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <div id="authNavBtn" style="display:flex; align-items:center;">
          <a href="login.html" class="btn-auth-nav">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Ingresar
          </a>
        </div>
        <button class="cart-trigger-btn" id="cartTriggerBtn" aria-label="Ver Carrito de Compras">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span class="cart-trigger-text">Carrito</span>
          <span class="cart-badge-count">0</span>
        </button>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menu">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- FONDO DECORATIVO -->
  <div style="position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;">
    <img src="assets/images/origen-paisaje.jpg" alt="" style="width:100%; height:100%; object-fit:cover; opacity:0.08;">
    <div style="position:absolute; inset:0; background: radial-gradient(ellipse at center, rgba(197,160,89,0.06) 0%, #0D0806 70%);"></div>
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <main style="position:relative; z-index:1; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:100px 20px 60px;">
    <div class="auth-card">

      <!-- Logo decorativo -->
      <div class="auth-logo-wrap">
        <img src="assets/images/logo-original.png" alt="Alma & Origen" style="width:70px; height:70px; object-fit:contain; filter:drop-shadow(0 4px 16px rgba(197,160,89,0.5));">
        <div class="auth-gold-line"></div>
      </div>

      <!-- Título -->
      <h1 class="auth-title">Bienvenido de Vuelta</h1>
      <p class="auth-subtitle">Ingresa a tu cuenta de Alma &amp; Origen</p>

      <!-- Alerta de mensajes -->
      <div class="auth-alert" id="authAlert" style="display:none;"></div>

      <!-- FORMULARIO LOGIN -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="loginEmail">Correo electrónico</label>
          <div class="auth-input-wrap">
            <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" required autocomplete="email">
          </div>
        </div>
        <div class="auth-field">
          <label for="loginPassword">Contraseña</label>
          <div class="auth-input-wrap">
            <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pass" onclick="togglePass('loginPassword', this)" aria-label="Ver contraseña">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="loginBtn">
          <span id="loginBtnText">Iniciar Sesión</span>
          <span id="loginBtnLoading" style="display:none;">
            <svg class="auth-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
            Ingresando...
          </span>
        </button>
      </form>

      <!-- Divisor -->
      <div class="auth-divider"><span>¿No tienes cuenta?</span></div>

      <!-- Botón Registro -->
      <a href="registro.html" class="btn-auth-secondary">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
        Crear cuenta nueva
      </a>

      <p class="auth-footer-note">
        Al ingresar aceptas nuestros <a href="#">términos de uso</a> y <a href="#">política de privacidad</a>.
      </p>
    </div>
  </main>

  <!-- Firebase SDK -->
  <!-- Mock local (sin Firebase) -->
  <script src="local-mock.js"></script>
  <script src="auth.js"></script>

  <script>
    // ── Mostrar/ocultar contraseña
    function togglePass(inputId, btn) {
      const inp = document.getElementById(inputId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    // ── Mostrar alerta
    function showAlert(msg, type = 'error') {
      const el = document.getElementById('authAlert');
      el.textContent = msg;
      el.className = 'auth-alert auth-alert--' + type;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 5000);
    }

    // ── Submit login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) { showAlert('Completa todos los campos.'); return; }

      document.getElementById('loginBtnText').style.display    = 'none';
      document.getElementById('loginBtnLoading').style.display = 'flex';
      document.getElementById('loginBtn').disabled = true;

      try {
        const auth = firebase.auth();
        const db   = firebase.firestore();
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const snap = await db.collection('usuarios').doc(cred.user.uid).get();
        const rol  = snap.data()?.rol || 'cliente';

        // Redirigir según rol
        const params = new URLSearchParams(window.location.search);
        if (rol === 'admin') {
          window.location.href = 'admin.html';
        } else if (params.get('redirect') === 'compra') {
          window.location.href = 'portafolio.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        const msgs = {
          'auth/user-not-found':   'No existe una cuenta con ese correo.',
          'auth/wrong-password':   'Contraseña incorrecta. Intenta de nuevo.',
          'auth/invalid-email':    'El correo no tiene un formato válido.',
          'auth/too-many-requests':'Demasiados intentos. Espera un momento.',
          'auth/invalid-credential': 'Correo o contraseña incorrectos.'
        };
        showAlert(msgs[err.code] || 'Error al iniciar sesión: ' + err.message);
        document.getElementById('loginBtnText').style.display    = 'inline';
        document.getElementById('loginBtnLoading').style.display = 'none';
        document.getElementById('loginBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
